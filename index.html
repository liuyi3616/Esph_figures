<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3LPL topological fingerprints: reproduction of Cang &amp; Wei (2018) Figures 3 and 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/3dmol@2.5.4/build/3Dmol-min.js"></script>
<style>
:root{
  --page:#e9edf2; --plate:#ffffff; --ink:#18212e; --muted:#566273; --rule:#c9d1db;
  --accent:#1d3fc4; --btn:#f3f5f8;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#141a22; --ink:#e3e8ef; --muted:#9aa6b6; --rule:#2c3643; --accent:#8fa6ff; --btn:#eef1f5; }
}
:root[data-theme="dark"]{ --page:#141a22; --ink:#e3e8ef; --muted:#9aa6b6; --rule:#2c3643; --accent:#8fa6ff; --btn:#eef1f5; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding:40px 20px 64px}
header{max-width:760px;margin-bottom:24px}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.7rem,3.4vw,2.35rem);line-height:1.18;margin:0 0 14px;letter-spacing:-0.01em}
.lede{color:var(--muted);margin:0 0 18px;max-width:68ch}
.params{display:flex;flex-wrap:wrap;gap:8px 22px;margin:0;padding:12px 0 0;border-top:1px solid var(--rule);font-size:.9rem}
.params div{display:flex;gap:6px}
.params dt{color:var(--muted)} .params dd{margin:0;font-weight:500}
figure{margin:0 0 56px}
.fig-head{display:flex;align-items:baseline;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.fig-head h2{font-family:var(--serif);font-weight:600;font-size:1.45rem;margin:0}
.fig-head p{margin:0;color:var(--muted)}
.plate{background:var(--plate);color:#18212e;border:1px solid var(--rule);padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:18px 22px}
.panel{min-width:0;display:flex;flex-direction:column}
.panel-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;min-height:30px}
.tag{font-family:var(--serif);font-weight:600;font-size:1.15rem;color:#18212e}
.tag span{font-family:var(--sans);font-weight:400;font-size:.88rem;color:#566273;margin-left:8px}
.mol{position:relative;width:100%;aspect-ratio:4/3;border:1px solid #e1e6ec;background:#fff}
.mol .fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center;color:#566273;font-size:.9rem}
.bars{width:100%;height:auto;display:block}
.bars-box{flex:1;display:flex;align-items:flex-start}
button.reset{font:inherit;font-size:.82rem;padding:4px 10px;border:1px solid #c9d1db;background:var(--btn);color:#18212e;cursor:pointer;border-radius:3px}
button.reset:hover{border-color:#1d3fc4}
button.reset:focus-visible{outline:2px solid #1d3fc4;outline-offset:2px}
.stats{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr;gap:22px;border-top:1px solid #e1e6ec;padding-top:12px;font-size:.88rem;color:#3c4757}
.stats b{color:#18212e;font-weight:600}
figcaption{margin-top:14px;max-width:80ch;font-family:var(--serif);font-size:1rem;line-height:1.62}
figcaption strong{font-weight:600}
.legend{display:inline-flex;align-items:center;gap:4px;margin-right:10px;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.25)}
footer{border-top:1px solid var(--rule);padding-top:14px;color:var(--muted);font-size:.85rem;max-width:80ch}
@media (max-width:720px){
  .plate,.stats{grid-template-columns:1fr}
  .plate{padding:12px}
  .p-a{order:1}.p-b{order:2}.p-c{order:3}.p-d{order:4}.stats{order:5}
}
</style>
</head>
